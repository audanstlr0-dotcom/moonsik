<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf6" />
    <meta name="color-scheme" content="light only" />
    <meta name="description" content="신생아·영유아 예방접종 일정을 개월 수에 맞춰 알려주고, 접종 여부를 체크하는 수첩" />
    <title>아기 예방접종 수첩</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="접종수첩" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="28" height="28" />
        <span>예방접종 수첩</span>
      </div>
      <label class="child-switch" hidden>
        <span class="sr-only">아이 선택</span>
        <select id="child-select"></select>
      </label>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="메뉴">
      <button type="button" data-view="home" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" /></svg>
        <span>홈</span>
      </button>
      <button type="button" data-view="schedule">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm3.5 9 2.5 2.5 4.5-5" /></svg>
        <span>접종표</span>
      </button>
      <button type="button" data-view="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm7.4-3a7.4 7.4 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7.3 7.3 0 0 0-2-1.2L14.5 3h-5l-.4 2.6a7.3 7.3 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7.4 7.4 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7.3 7.3 0 0 0 2 1.2l.4 2.6h5l.4-2.6a7.3 7.3 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z" /></svg>
        <span>설정</span>
      </button>
    </nav>

    <dialog id="dialog"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
